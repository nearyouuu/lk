events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        # Собранный frontend (index.html и assets) должен находиться здесь.
        root /usr/share/nginx/html;
        index index.html;

        # Backend API всегда вызывается через /lk/.
        location = /lk {
            return 308 /lk/;
        }

        location ^~ /lk/ {
            proxy_pass http://backend:6123;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            client_max_body_size 10m;
        }

        # Загруженные backend-файлы доступны без SPA fallback.
        location ^~ /media/ {
            proxy_pass http://backend:6123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Хешированные frontend assets можно долго кэшировать.
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA history fallback. При refresh /admin, /director и других
        # клиентских маршрутов возвращается index.html, а роутинг выполняет frontend.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
